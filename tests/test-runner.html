<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusCred — Visual Test Suite Runner</title>
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <style>
    body { background: #0B132B; color: #F8FAFC; font-family: system-ui, -apple-system, sans-serif; padding: 32px 20px; }
    .runner-wrap { max-width: 900px; margin: 0 auto; }
    .runner-card { background: #1C2541; border: 1px solid #3A506B; border-radius: 12px; padding: 24px; margin-bottom: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    .suite-card { background: #0F172A; border: 1px solid #1E293B; border-radius: 10px; margin-bottom: 16px; overflow: hidden; }
    .suite-head { padding: 12px 16px; background: #1E293B; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: space-between; }
    .test-row { padding: 10px 16px; border-bottom: 1px solid #1E293B; display: flex; align-items: center; justify-content: space-between; font-size: 13px; }
    .test-row:last-child { border-bottom: none; }
    .badge-pass { background: rgba(34, 197, 94, 0.15); color: #4ADE80; border: 1px solid rgba(34, 197, 94, 0.3); padding: 2px 8px; border-radius: 4px; font-weight: 700; font-size: 11px; }
    .badge-fail { background: rgba(239, 68, 68, 0.15); color: #F87171; border: 1px solid rgba(239, 68, 68, 0.3); padding: 2px 8px; border-radius: 4px; font-weight: 700; font-size: 11px; }
    .progress-bar { height: 8px; border-radius: 4px; background: #334155; overflow: hidden; margin: 16px 0; }
    .progress-fill { height: 100%; background: #22C55E; transition: width 0.3s; }
  </style>
</head>
<body>
  <div class="runner-wrap">
    <div class="runner-card">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
        <div>
          <h1 style="font-size:22px;margin:0 0 4px">CampusCred — Visual Test Suite Runner</h1>
          <p style="color:#94A3B8;font-size:13px;margin:0">Modular Unit &amp; Integration Test Harness (3 Work Packages)</p>
        </div>
        <div style="display:flex;gap:10px">
          <button id="runBtn" class="btn btn-primary" style="background:#2563EB;border-color:#2563EB;color:#fff;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:600">Run All Tests</button>
          <a href="../index.html" class="btn btn-outline" style="background:rgba(255,255,255,0.08);border:1px solid #475569;color:#F8FAFC;padding:8px 16px;border-radius:6px;text-decoration:none;font-weight:600">Return to App</a>
        </div>
      </div>

      <div class="progress-bar">
        <div id="pFill" class="progress-fill" style="width: 0%"></div>
      </div>

      <div style="display:grid;grid-template-columns:repeat(4, 1fr);gap:12px;margin-top:16px;text-align:center">
        <div style="background:#0F172A;padding:12px;border-radius:8px;border:1px solid #1E293B">
          <div style="font-size:11px;color:#94A3B8">TOTAL TESTS</div>
          <div id="statTotal" style="font-size:20px;font-weight:800;color:#F8FAFC">0</div>
        </div>
        <div style="background:#0F172A;padding:12px;border-radius:8px;border:1px solid #1E293B">
          <div style="font-size:11px;color:#94A3B8">PASSED</div>
          <div id="statPassed" style="font-size:20px;font-weight:800;color:#4ADE80">0</div>
        </div>
        <div style="background:#0F172A;padding:12px;border-radius:8px;border:1px solid #1E293B">
          <div style="font-size:11px;color:#94A3B8">FAILED</div>
          <div id="statFailed" style="font-size:20px;font-weight:800;color:#F87171">0</div>
        </div>
        <div style="background:#0F172A;padding:12px;border-radius:8px;border:1px solid #1E293B">
          <div style="font-size:11px;color:#94A3B8">SUITES</div>
          <div id="statSuites" style="font-size:20px;font-weight:800;color:#60A5FA">7</div>
        </div>
      </div>
    </div>

    <div id="resultsHost"></div>
  </div>

  <!-- Firebase Stubs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- Core Layer -->
  <script src="../js/data/mockData.js"></script>
  <script src="../js/services/store.js"></script>
  <script src="../js/services/activityService.js"></script>
  <script src="../js/services/reportService.js"></script>
  <script src="../js/components/icons.js"></script>
  <script src="../js/components/ui.js"></script>
  <script src="../js/components/charts.js"></script>
  <script src="../js/components/shell.js"></script>

  <!-- Modular Work Packages -->
  <script src="../js/modules/auth/authService.js"></script>
  <script src="../js/modules/auth/loginPage.js"></script>

  <script src="../js/modules/profile/profileService.js"></script>
  <script src="../js/modules/profile/profileCropper.js"></script>
  <script src="../js/modules/profile/studentProfile.js"></script>

  <script src="../js/modules/certificate/certificateRenderer.js"></script>
  <script src="../js/modules/certificate/certificateUpload.js"></script>
  <script src="../js/modules/certificate/certificateService.js"></script>
  <script src="../js/modules/certificate/studentActivities.js"></script>
  <script src="../js/modules/certificate/studentAddActivity.js"></script>
  <script src="../js/modules/certificate/studentVerifyCert.js"></script>

  <script src="../js/modules/resume/atsService.js"></script>
  <script src="../js/modules/resume/resumeGenerator.js"></script>
  <script src="../js/modules/resume/studentPortfolio.js"></script>
  <script src="../js/modules/resume/studentLinks.js"></script>

  <script src="../js/modules/verification/studentVerificationService.js"></script>
  <script src="../js/modules/verification/activityVerificationService.js"></script>
  <script src="../js/modules/verification/studentRegistrationReview.js"></script>
  <script src="../js/modules/verification/facultyVerification.js"></script>

  <script src="../js/pages/student/studentDashboard.js"></script>
  <script src="../js/pages/student.js"></script>

  <!-- Test Framework -->
  <script src="test-framework.js"></script>

  <!-- Test Suites -->
  <script src="student-profile.test.js"></script>
  <script src="certificate-upload.test.js"></script>
  <script src="resume-generator.test.js"></script>
  <script src="ats-score.test.js"></script>
  <script src="student-verification.test.js"></script>
  <script src="authentication.test.js"></script>
  <script src="integration.test.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (window.CC && window.CC.Store) {
        window.CC.Store.init();
      }

      const runBtn = document.getElementById('runBtn');
      const resultsHost = document.getElementById('resultsHost');
      const pFill = document.getElementById('pFill');
      const statTotal = document.getElementById('statTotal');
      const statPassed = document.getElementById('statPassed');
      const statFailed = document.getElementById('statFailed');
      const statSuites = document.getElementById('statSuites');

      async function execute() {
        runBtn.disabled = true;
        runBtn.textContent = 'Running Tests…';
        resultsHost.innerHTML = '<div style="text-align:center;padding:24px;color:#94A3B8">Executing test suites…</div>';

        const registry = await window.TestRunner.runAll();

        statTotal.textContent = registry.totalPassed + registry.totalFailed;
        statPassed.textContent = registry.totalPassed;
        statFailed.textContent = registry.totalFailed;
        statSuites.textContent = registry.suites.length;

        const total = registry.totalPassed + registry.totalFailed;
        const pct = total ? Math.round((registry.totalPassed / total) * 100) : 0;
        pFill.style.width = pct + '%';
        pFill.style.background = registry.totalFailed > 0 ? '#EF4444' : '#22C55E';

        let html = '';
        registry.suites.forEach(function (suite) {
          const suiteResults = registry.results.filter(r => r.suite === suite.name);
          const suiteFails = suiteResults.filter(r => !r.passed).length;
          html += '<div class="suite-card">' +
            '<div class="suite-head">' +
              '<span>' + suite.name + '</span>' +
              '<span class="' + (suiteFails > 0 ? 'badge-fail' : 'badge-pass') + '">' +
                (suiteFails > 0 ? suiteFails + ' Failed' : suiteResults.length + ' Passed') +
              '</span>' +
            '</div>';

          suiteResults.forEach(function (tr) {
            html += '<div class="test-row">' +
              '<div>' +
                '<span style="margin-right:8px">' + (tr.passed ? '✔' : '✖') + '</span>' +
                '<span>' + tr.name + '</span>' +
                (tr.error ? '<div style="color:#F87171;font-size:11.5px;margin-top:4px;font-family:monospace">' + tr.error + '</div>' : '') +
              '</div>' +
              '<span class="' + (tr.passed ? 'badge-pass' : 'badge-fail') + '">' + (tr.passed ? 'PASSED' : 'FAILED') + '</span>' +
            '</div>';
          });

          html += '</div>';
        });

        resultsHost.innerHTML = html;
        runBtn.disabled = false;
        runBtn.textContent = 'Re-Run All Tests';
      }

      runBtn.addEventListener('click', execute);
      execute();
    });
  </script>
</body>
</html>
